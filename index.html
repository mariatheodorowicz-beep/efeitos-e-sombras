<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desafio Flexbox & Interatividade</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <h1>Blog de Desafios Frontend</h1>
    <button id="theme-toggle" class="theme-btn">Mudar Tema 🌙</button>
  </header>

  <main class="container">
    <article>
      <img src="https://via.placeholder.com/200x150" alt="Imagem da postagem 1">
      <div class="card-content">
        <h2>Título da Postagem 1</h2>
        <p>Este é o resumo da primeira postagem. Passe o mouse sobre o card para ver o efeito de zoom e destaque na sombra!</p>
        <button class="card-btn">Leia mais</button>
      </div>
    </article>

    <article>
      <img src="https://via.placeholder.com/200x150" alt="Imagem da postagem 2">
      <div class="card-content">
        <h2>Título da Postagem 2</h2>
        <p>Outra postagem adaptada para o formato horizontal com efeitos visuais e suporte a Modo Escuro.</p>
        <button class="card-btn">Leia mais</button>
      </div>
    </article>
  </main>

  <script src="script.js"></script>
</body>
</html>
