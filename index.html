<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desafio CSS - Cards Interativos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <h1 class="header__title">Blog Dev</h1>
    <button id="theme-toggle" class="header__theme-btn" aria-label="Alternar tema">
      <span>🌙 Modo Escuro</span>
    </button>
  </header>

  <main class="post-list">
    <article class="card">
      <img src="https://via.placeholder.com/220x160" alt="Capa da postagem 1" class="card__image">
      <div class="card__content">
        <h2 class="card__title">Construindo Layouts com Flexbox</h2>
        <p class="card__description">
          Aprenda a estruturar postagens horizontais e utilizar efeitos interativos como zoom e sombras personalizadas.
        </p>
        <button class="card__button">Ler Artigo</button>
      </div>
    </article>

    <article class="card">
      <img src="https://via.placeholder.com/220x160" alt="Capa da postagem 2" class="card__image">
      <div class="card__content">
        <h2 class="card__title">Estilização Avançada e Dark Mode</h2>
        <p class="card__description">
          Descubra como criar temas claro e escuro eficientes utilizando variáveis CSS e transições suaves.
        </p>
        <button class="card__button">Ler Artigo</button>
      </div>
    </article>
  </main>

  <script src="script.js"></script>
</body>
</html>
